# MarginGuard CI Pipeline
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint + Format + Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marginguard
          POSTGRES_PASSWORD: marginguard_dev_2025
          POSTGRES_DB: marginguard
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api
    
    env:
      DATABASE_URL: postgresql+psycopg2://marginguard:marginguard_dev_2025@localhost:15432/marginguard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app/

      - name: Format check (ruff format)
        run: ruff format --check app/

      - name: Verify app loads
        run: python -c "from app.main import app; print('FastAPI app loaded OK')"

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: pytest --tb=short -v

  frontend:
    name: Frontend (Lint + Typecheck + Format + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx oxlint src/
      - name: Type check
        run: npx tsc --noEmit
      - name: Format check
        run: npx prettier --check src/
      - name: Build
        run: npm run build