# MarginGuard CI Pipeline
# Runs linting, formatting, type checking, build, and tests on every push and PR.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────
  # Backend Quality Checks
  # ──────────────────────────────────────
  backend:
    name: Backend (Lint + Format + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app/

      - name: Format check (ruff format)
        run: ruff format --check app/

      - name: Verify app loads
        run: python -c "from app.main import app; print('FastAPI app loaded OK')"

      - name: Run tests
        run: pytest --tb=short -q

  # ──────────────────────────────────────
  # Frontend Quality Checks
  # ──────────────────────────────────────
  frontend:
    name: Frontend (Lint + Typecheck + Format + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint src/

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Format check (prettier)
        run: npx prettier --check src/

      - name: Build
        run: npm run build
