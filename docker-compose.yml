# MarginGuard — Local Development Services
# Usage: docker compose up -d postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: marginguard-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marginguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marginguard_dev_2025}
      POSTGRES_DB: ${POSTGRES_DB:-marginguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marginguard} -d ${POSTGRES_DB:-marginguard}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local


