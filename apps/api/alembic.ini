# MarginGuard Alembic Configuration
# See ADR-005 for database strategy decisions.

[alembic]
# Use the existing migrations/ directory (created in MG-S0.1)
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for file_template (UTC to match our timestamp convention)
timezone = UTC

# Truncate long revision identifiers to this length
truncate_slug_length = 40

# sys.path prepended when running migrations (allows importing app.*)
prepend_sys_path = .

# SQLAlchemy connection URL — overridden by env.py from app settings
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
